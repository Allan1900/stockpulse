services:
  postgres:
    image: postgres:16-alpine
    container_name: stockpulse-pg
    environment:
      POSTGRES_DB: ashare
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: change-me
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d ashare"]
      interval: 10s
      timeout: 5s
      retries: 5

  stockpulse:
    build: .
    container_name: stockpulse-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ashare
      PGUSER: stockpulse
      PGPASSWORD: change-me
      SP_DATA_DIR: /data
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - sp_data:/data
    ports:
      - "8000:8000"

volumes:
  pg_data:
  sp_data:
